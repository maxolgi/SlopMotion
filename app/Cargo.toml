[package]
name = "slopmotion"
version = "0.1.0"
edition = "2021"
description = "SolidJS web app for OSC motion streaming, packaged as a standalone server"
license = "AGPL-3.0-or-later"
keywords = ["osc", "udp", "motion", "vj"]
categories = ["multimedia", "network-programming"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
futures = "0.3"
rosc = "0.10"
clap = { version = "4", features = ["derive"] }
open = "5"
local-ip-address = "0.6"
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
], optional = true }

[features]
default = ["gui"]
gui = ["dep:eframe"]
